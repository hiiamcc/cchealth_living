name: Notion 文章發布安全測試

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 安裝 Python 套件
        run: python3 -m pip install beautifulsoup4

      - name: 測試已發布文章不可覆蓋
        shell: bash
        run: |
          if python3 scripts/build_notion_publish.py --slug stroke-brain-recovery; then
            echo "測試失敗：已存在的文章沒有被阻擋"
            exit 1
          else
            echo "測試通過：已存在的文章被阻擋"
          fi

      - name: 測試不存在的文章不可發布
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
      - name: 測試不存在的文章不可發布
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
        run: |
          set +e
          python3 scripts/build_notion_publish.py --slug test-new-article > result.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "測試失敗：不存在的文章被允許通過"
            exit 1
          fi
          if grep -q "找到 0 篇符合網址代稱的文章" result.log; then
            echo "測試通過：不存在的文章被正確阻擋"
          else
            echo "測試失敗：程式不是因為找不到文章而停止"
            sed -E 's/(secret|token|password)[^ ]*/[REDACTED]/Ig' result.log
            exit 1
          fi
            echo "測試失敗：不存在的 Notion 文章被允許通過"
            exit 1
          else
            echo "程式已拒絕請求；仍需檢查失敗原因是否正確"
          fi

      - name: 確認沒有修改網站檔案
        run: git diff --exit-code
