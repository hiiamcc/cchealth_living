name: Notion 文章發布安全測試

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 下載開發分支程式
        uses: actions/checkout@v4

      - name: 測試已發布文章不可覆蓋
        shell: bash
        run: |
          if python3 scripts/build_notion_publish.py --slug stroke-brain-recovery; then
            echo "測試失敗：已存在的文章沒有被阻擋"
            exit 1
          else
            echo "測試通過：已存在的文章被阻擋"
          fi

      - name: 測試不存在的文章不可發布
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
        run: |
          if python3 scripts/build_notion_publish.py --slug test-new-article; then
            echo "測試失敗：不存在的 Notion 文章被允許通過"
            exit 1
          else
            echo "程式已拒絕請求；仍需檢查失敗原因是否正確"
          fi

      - name: 確認沒有修改網站檔案
        run: git diff --exit-code
