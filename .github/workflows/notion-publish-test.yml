name: Notion 文章發布安全測試

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 下載開發分支程式
        uses: actions/checkout@v4
        
      - name: 安裝 Python 套件
        run: python3 -m pip install beautifulsoup4

      - name: 測試已發布文章不可覆蓋
        shell: bash
        run: |
          if python3 scripts/build_notion_publish.py --slug stroke-brain-recovery; then
            echo "測試失敗：已存在的文章沒有被阻擋"
            exit 1
          else
            echo "測試通過：已存在的文章被阻擋"
          fi

    
      - name: 測試不存在的文章不可發布
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
        run: |
          set +e
          python3 scripts/build_notion_publish.py --slug test-new-article > result.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "測試失敗：不存在的文章被允許通過"
            exit 1
          fi
          if grep -q "找到 0 篇符合網址代稱的文章" result.log; then
            echo "測試通過：不存在的文章被正確阻擋"
          else
            echo "測試失敗：程式不是因為找不到文章而停止"
            sed -E 's/(secret|token|password)[^ ]*/[REDACTED]/Ig' result.log
            exit 1
          fi


      - name: 測試可找到待審核的 Notion 文章
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/build_notion_publish.py --slug notion-publish-test > result.log 2>&1
          cat result.log
          grep -q "已找到符合條件的 Notion 文章" result.log
          test -s publish-test-output/notion-publish-test.html



      - name: 測試更新模式的安全限制
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        shell: bash
        run: |
          set -e

          echo "測試：不存在的文章不能更新"
          if python3 scripts/build_notion_publish.py --slug article-that-does-not-exist --mode update; then
            echo "測試失敗：允許更新不存在的文章"
            exit 1
          fi

          echo "測試：已存在的文章可以進入更新檢查"
          python3 scripts/build_notion_publish.py --slug stroke-brain-recovery --mode update

          echo "更新模式安全測試通過"

      - name: 保存 HTML 測試檔案
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-publish-html-test
          path: publish-test-output/*.html
          if-no-files-found: warn
          retention-days: 7

      - name: 確認沒有修改網站檔案
        run: git diff --exit-code
