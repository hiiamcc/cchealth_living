
name: Notion 文章讀取測試

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取 Notion 文章
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ["NOTION_TOKEN"]
          database_id = os.environ["NOTION_DATABASE_ID"]

          headers = {
              "Authorization": "Bearer " + token,
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
          }

          def notion_request(url, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url, data=data, headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          try:
              url = (
                  "https://api.notion.com/v1/databases/"
                  + database_id + "/query"
              )
              result = notion_request(
                  url, {"page_size": 10}
              )
              pages = result.get("results", [])

              print("成功讀取文章資料庫")
              print("本次取得文章數：", len(pages))

              for page in pages:
                  properties = page.get("properties", {})
                  print("文章欄位：", ", ".join(properties.keys()))

                  page_id = page["id"]
                  blocks = notion_request(
                      "https://api.notion.com/v1/blocks/"
                      + page_id + "/children?page_size=100"
                  )

                  print(
                      "成功讀取文章內文區塊，數量：",
                      len(blocks.get("results", []))
                  )

              print("Notion 文章讀取測試完成！")

          except urllib.error.HTTPError as error:
              print("讀取失敗，HTTP 狀態碼：", error.code)
              raise SystemExit(1)
          PY
