name: Notion 文章預覽產生器

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: 下載網站檔案
        uses: actions/checkout@v4
      - name: 安裝 HTML 解析套件
        run: python3 -m pip install beautifulsoup4
      - name: 產生待審核文章預覽
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/build_notion_preview.py
      - name: 上傳預覽檔案供人工檢查
        uses: actions/upload-artifact@v4
        with:
          name: notion-article-preview
          path: preview-output/*.html
          if-no-files-found: error
          retention-days: 1
