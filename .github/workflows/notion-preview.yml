
name: Notion 完整文章讀取測試

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 讀取完整 Notion 文章
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ["NOTION_TOKEN"]
          database_id = os.environ["NOTION_DATABASE_ID"]

          headers = {
              "Authorization": "Bearer " + token,
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
          }

          def request_notion(url, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url, data=data, headers=headers
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          def get_all_blocks(page_id):
              blocks = []
              cursor = None

              while True:
                  url = (
                      "https://api.notion.com/v1/blocks/"
                      + page_id + "/children?page_size=100"
                  )

                  if cursor:
                      url += "&start_cursor=" + cursor

                  result = request_notion(url)
                  blocks.extend(result.get("results", []))

                  if not result.get("has_more"):
                      break

                  cursor = result.get("next_cursor")
                  if not cursor:
                      raise RuntimeError(
                          "Notion 回傳 has_more，但沒有 next_cursor"
                      )

              return blocks

          try:
              url = (
                  "https://api.notion.com/v1/databases/"
                  + database_id + "/query"
              )
              result = request_notion(
                  url, {"page_size": 100}
              )
              pages = result.get("results", [])

              print("成功讀取 Notion 資料庫")
              print("本次取得文章數：", len(pages))

              for page in pages:
                  blocks = get_all_blocks(page["id"])

                  print("--------------------")
                  print("文章 ID：", page["id"])
                  print("第一層內文區塊總數：", len(blocks))
                  print(
                      "包含子區塊的數量：",
                      sum(
                          1 for block in blocks
                          if block.get("has_children")
                      )
                  )

              print("--------------------")
              print("完整文章分頁讀取測試成功！")

          except urllib.error.HTTPError as error:
              print("Notion API 錯誤：", error.code)
              raise SystemExit(1)
          PY
